name: 636-649 paired control

on:
  push:
    branches: [scratch/636-649-paired-driver]

permissions:
  contents: read

env:
  CONTROL_SHA: 0159a7fef5c3b5ae4f0f6b0d292df6bee49abf4d
  CONTROL_BASE_SHA: 7d7c6fb198ff008bbf1cf5bb953319b1d762008d
  CANDIDATE_SHA: 2dfb616f3253d154c5a4f73c35f65e9f2a62d827
  CANDIDATE_BASE_SHA: b201ee83e054a416d12cbe449b170ab9ffbc6956

jobs:
  paired-control:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact delivery candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          path: arms/candidate
          fetch-depth: 3
          persist-credentials: false

      - name: Check out exact original-base control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.CONTROL_SHA }}
          path: arms/control
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Prove exact heads, ancestry, and diagnostic equivalence
        run: |
          set -euo pipefail
          mkdir -p evidence/source evidence/boundary
          test "$(git -C arms/control rev-parse HEAD)" = "$CONTROL_SHA"
          test "$(git -C arms/candidate rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C arms/control rev-parse HEAD^)" = "$CONTROL_BASE_SHA"
          git -C arms/candidate merge-base --is-ancestor "$CANDIDATE_BASE_SHA" "$CANDIDATE_SHA"
          test "$(git -C arms/candidate rev-parse "$CANDIDATE_BASE_SHA^{commit}")" = "$CANDIDATE_BASE_SHA"
          test "$(git -C arms/control diff --name-only "$CONTROL_BASE_SHA" "$CONTROL_SHA")" = scripts/bench-daemon.mjs
          git -C arms/control diff --quiet "$CONTROL_BASE_SHA" "$CONTROL_SHA" -- src
          git -C arms/candidate diff --quiet "$CANDIDATE_BASE_SHA" "$CANDIDATE_SHA" -- src
          git -C arms/control diff --unified=0 "$CONTROL_BASE_SHA" "$CONTROL_SHA" -- scripts/bench-daemon.mjs \
            | sed '/^diff --git /d;/^index /d;/^--- /d;/^+++ /d;/^@@ /d' \
            > evidence/source/control-instrumentation.payload
          git -C arms/candidate diff --unified=0 "$CANDIDATE_BASE_SHA" "$CANDIDATE_SHA" -- scripts/bench-daemon.mjs \
            | sed '/^diff --git /d;/^index /d;/^--- /d;/^+++ /d;/^@@ /d' \
            > evidence/source/candidate-instrumentation.payload
          cmp evidence/source/control-instrumentation.payload evidence/source/candidate-instrumentation.payload
          sha256sum evidence/source/control-instrumentation.payload evidence/source/candidate-instrumentation.payload \
            | tee evidence/source/instrumentation-sha256.txt
          cmp arms/control/scripts/check-daemon-benchmark.mjs arms/candidate/scripts/check-daemon-benchmark.mjs
          cmp arms/control/benchmarks/daemon-baseline.json arms/candidate/benchmarks/daemon-baseline.json
          cmp arms/control/package.json arms/candidate/package.json
          cmp arms/control/package-lock.json arms/candidate/package-lock.json
          {
            printf 'candidate=%s\n' "$CANDIDATE_SHA"
            printf 'candidate_base=%s\n' "$CANDIDATE_BASE_SHA"
            printf 'control=%s\n' "$CONTROL_SHA"
            printf 'control_base=%s\n' "$CONTROL_BASE_SHA"
            printf 'fixed_order=candidate_then_control\n'
            printf 'runner=%s\n' "$RUNNER_NAME"
            printf 'image=%s\n' "${ImageOS:-unknown}-${ImageVersion:-unknown}"
          } > evidence/source/heads-and-runner.txt

      - name: Install candidate dependencies separately
        working-directory: arms/candidate
        run: |
          set -euo pipefail
          rm -f package-lock.json
          bun install

      - name: Snapshot shared runtime state before candidate
        run: |
          set -euo pipefail
          runtime_manifest() {
            for root in \
              "$HOME/.local/state/cmuxlayer" \
              "$HOME/.local/state/cmux-agents" \
              "$HOME/.cmux" \
              "$HOME/.cmuxlayer" \
              "$HOME/.config/cmuxlayer"
            do
              if [ -e "$root" ]; then
                find -P "$root" -xdev -printf '%y %p -> %l\n'
                find -P "$root" -xdev -type f -exec sha256sum {} +
              else
                printf 'ABSENT %s\n' "$root"
              fi
            done | LC_ALL=C sort
          }
          runtime_manifest > evidence/boundary/before-candidate-runtime.txt

      - name: Run candidate 8x12 and inventory all live processes and sockets
        working-directory: arms/candidate
        env:
          CMUXLAYER_BENCH_ROUNDS: "12"
          CMUXLAYER_PERF_ARTIFACT_DIR: ${{ github.workspace }}/evidence/candidate
        run: |
          set +e
          set -o pipefail
          snapshot_processes() {
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = []
          scanner_pid = os.getpid()
          for proc in Path("/proc").glob("[0-9]*"):
              try:
                  pid = int(proc.name)
                  if pid == scanner_pid:
                      continue
                  stat_tail = (proc / "stat").read_text().rsplit(")", 1)[1].split()
                  start_ticks = stat_tail[19]
                  rows.append({
                      "identity": f"{pid}:{start_ticks}",
                      "pid": pid,
                      "ppid": int(stat_tail[1]),
                      "exe": os.readlink(proc / "exe"),
                      "cwd": os.readlink(proc / "cwd"),
                      "cmdline": (proc / "cmdline").read_bytes().replace(b"\0", b" ").decode("utf-8", "replace"),
                  })
              except (FileNotFoundError, PermissionError, ProcessLookupError, ValueError, IndexError):
                  continue
          for row in sorted(rows, key=lambda item: (item["pid"], item["identity"])):
              print(json.dumps(row, sort_keys=True))
          PY
          }
          snapshot_sockets() {
            python3 - <<'PY'
          from pathlib import Path

          try:
              lines = Path("/proc/net/unix").read_text().splitlines()[1:]
          except FileNotFoundError:
              raise SystemExit(2)
          paths = {parts[7] for line in lines if len(parts := line.split()) >= 8}
          for path in sorted(paths):
              print(path)
          PY
          }
          snapshot_processes > "$GITHUB_WORKSPACE/evidence/boundary/candidate-processes-before.jsonl"
          candidate_processes_before_exit=$?
          snapshot_sockets > "$GITHUB_WORKSPACE/evidence/boundary/candidate-sockets-before.txt"
          candidate_sockets_before_exit=$?
          bun run bench:daemon:check 2>&1 | tee "$GITHUB_WORKSPACE/evidence/candidate.log"
          candidate_exit=${PIPESTATUS[0]}
          snapshot_processes > "$GITHUB_WORKSPACE/evidence/boundary/candidate-processes-after.jsonl"
          candidate_processes_after_exit=$?
          snapshot_sockets > "$GITHUB_WORKSPACE/evidence/boundary/candidate-sockets-after.txt"
          candidate_sockets_after_exit=$?
          python3 - \
            "$GITHUB_WORKSPACE/evidence/boundary/candidate-processes-before.jsonl" \
            "$GITHUB_WORKSPACE/evidence/boundary/candidate-processes-after.jsonl" \
            > "$GITHUB_WORKSPACE/evidence/boundary/candidate-new-processes.jsonl" <<'PY'
          import json
          import sys

          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return {row["identity"]: row for line in handle if (row := json.loads(line))}

          before = load(sys.argv[1])
          after = load(sys.argv[2])
          new_rows = [after[key] for key in sorted(after.keys() - before.keys())]
          for row in new_rows:
              print(json.dumps(row, sort_keys=True))
          raise SystemExit(1 if new_rows else 0)
          PY
          candidate_new_process_exit=$?
          comm -13 \
            "$GITHUB_WORKSPACE/evidence/boundary/candidate-sockets-before.txt" \
            "$GITHUB_WORKSPACE/evidence/boundary/candidate-sockets-after.txt" \
            > "$GITHUB_WORKSPACE/evidence/boundary/candidate-new-sockets.txt"
          candidate_new_socket_exit=$?
          if [ "$candidate_new_socket_exit" -eq 0 ] && [ -s "$GITHUB_WORKSPACE/evidence/boundary/candidate-new-sockets.txt" ]; then
            candidate_new_socket_exit=1
          fi
          {
            printf 'benchmark=%s\n' "$candidate_exit"
            printf 'processes_before=%s\n' "$candidate_processes_before_exit"
            printf 'processes_after=%s\n' "$candidate_processes_after_exit"
            printf 'new_processes=%s\n' "$candidate_new_process_exit"
            printf 'sockets_before=%s\n' "$candidate_sockets_before_exit"
            printf 'sockets_after=%s\n' "$candidate_sockets_after_exit"
            printf 'new_sockets=%s\n' "$candidate_new_socket_exit"
            printf 'process_exclusion=inventory_scanner_pid_only\n'
          } > "$GITHUB_WORKSPACE/evidence/boundary/candidate-child-statuses.txt"
          printf '%s\n' "$candidate_exit" > "$GITHUB_WORKSPACE/evidence/candidate-exit.txt"
          exit 0

      - name: Prove candidate clean before control
        run: |
          set +e
          set -o pipefail
          boundary_exit=0
          runtime_manifest() {
            for root in \
              "$HOME/.local/state/cmuxlayer" \
              "$HOME/.local/state/cmux-agents" \
              "$HOME/.cmux" \
              "$HOME/.cmuxlayer" \
              "$HOME/.config/cmuxlayer"
            do
              if [ -e "$root" ]; then
                find -P "$root" -xdev -printf '%y %p -> %l\n'
                find -P "$root" -xdev -type f -exec sha256sum {} +
              else
                printf 'ABSENT %s\n' "$root"
              fi
            done | LC_ALL=C sort
          }
          runtime_manifest > evidence/boundary/after-candidate-runtime.txt
          manifest_exit=$?
          if [ "$manifest_exit" -ne 0 ]; then
            boundary_exit=40
          elif ! cmp evidence/boundary/before-candidate-runtime.txt evidence/boundary/after-candidate-runtime.txt; then
            diff -u evidence/boundary/before-candidate-runtime.txt evidence/boundary/after-candidate-runtime.txt \
              > evidence/boundary/candidate-runtime.diff
            boundary_exit=41
          fi
          candidate_scratch=evidence/candidate/scratch
          if [ -d "$candidate_scratch" ] && find "$candidate_scratch" -mindepth 1 -print -quit | grep -q .; then
            find "$candidate_scratch" -mindepth 1 -maxdepth 3 -print \
              > evidence/boundary/candidate-scratch-residue.txt
            boundary_exit=42
          fi
          candidate_children=evidence/boundary/candidate-child-statuses.txt
          if [ ! -f "$candidate_children" ]; then
            boundary_exit=43
          elif grep -Ev '^(benchmark|process_exclusion)=' "$candidate_children" | grep -Ev '=0$' > evidence/boundary/candidate-child-failures.txt; then
            boundary_exit=44
          fi
          printf '%s\n' "$boundary_exit" > evidence/boundary/candidate-boundary-exit.txt
          exit "$boundary_exit"

      - name: Install control dependencies separately
        if: success()
        working-directory: arms/control
        run: |
          set -euo pipefail
          rm -f package-lock.json
          bun install

      - name: Snapshot shared runtime state before final control
        if: success()
        run: |
          set -euo pipefail
          runtime_manifest() {
            for root in \
              "$HOME/.local/state/cmuxlayer" \
              "$HOME/.local/state/cmux-agents" \
              "$HOME/.cmux" \
              "$HOME/.cmuxlayer" \
              "$HOME/.config/cmuxlayer"
            do
              if [ -e "$root" ]; then
                find -P "$root" -xdev -printf '%y %p -> %l\n'
                find -P "$root" -xdev -type f -exec sha256sum {} +
              else
                printf 'ABSENT %s\n' "$root"
              fi
            done | LC_ALL=C sort
          }
          runtime_manifest > evidence/boundary/before-control-runtime.txt

      - name: Run final control 8x12 and inventory all live processes and sockets
        if: success()
        working-directory: arms/control
        env:
          CMUXLAYER_BENCH_ROUNDS: "12"
          CMUXLAYER_PERF_ARTIFACT_DIR: ${{ github.workspace }}/evidence/control
        run: |
          set +e
          set -o pipefail
          snapshot_processes() {
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          rows = []
          scanner_pid = os.getpid()
          for proc in Path("/proc").glob("[0-9]*"):
              try:
                  pid = int(proc.name)
                  if pid == scanner_pid:
                      continue
                  stat_tail = (proc / "stat").read_text().rsplit(")", 1)[1].split()
                  start_ticks = stat_tail[19]
                  rows.append({
                      "identity": f"{pid}:{start_ticks}",
                      "pid": pid,
                      "ppid": int(stat_tail[1]),
                      "exe": os.readlink(proc / "exe"),
                      "cwd": os.readlink(proc / "cwd"),
                      "cmdline": (proc / "cmdline").read_bytes().replace(b"\0", b" ").decode("utf-8", "replace"),
                  })
              except (FileNotFoundError, PermissionError, ProcessLookupError, ValueError, IndexError):
                  continue
          for row in sorted(rows, key=lambda item: (item["pid"], item["identity"])):
              print(json.dumps(row, sort_keys=True))
          PY
          }
          snapshot_sockets() {
            python3 - <<'PY'
          from pathlib import Path

          try:
              lines = Path("/proc/net/unix").read_text().splitlines()[1:]
          except FileNotFoundError:
              raise SystemExit(2)
          paths = {parts[7] for line in lines if len(parts := line.split()) >= 8}
          for path in sorted(paths):
              print(path)
          PY
          }
          snapshot_processes > "$GITHUB_WORKSPACE/evidence/boundary/control-processes-before.jsonl"
          control_processes_before_exit=$?
          snapshot_sockets > "$GITHUB_WORKSPACE/evidence/boundary/control-sockets-before.txt"
          control_sockets_before_exit=$?
          bun run bench:daemon:check 2>&1 | tee "$GITHUB_WORKSPACE/evidence/control.log"
          control_exit=${PIPESTATUS[0]}
          snapshot_processes > "$GITHUB_WORKSPACE/evidence/boundary/control-processes-after.jsonl"
          control_processes_after_exit=$?
          snapshot_sockets > "$GITHUB_WORKSPACE/evidence/boundary/control-sockets-after.txt"
          control_sockets_after_exit=$?
          python3 - \
            "$GITHUB_WORKSPACE/evidence/boundary/control-processes-before.jsonl" \
            "$GITHUB_WORKSPACE/evidence/boundary/control-processes-after.jsonl" \
            > "$GITHUB_WORKSPACE/evidence/boundary/control-new-processes.jsonl" <<'PY'
          import json
          import sys

          def load(path):
              with open(path, encoding="utf-8") as handle:
                  return {row["identity"]: row for line in handle if (row := json.loads(line))}

          before = load(sys.argv[1])
          after = load(sys.argv[2])
          new_rows = [after[key] for key in sorted(after.keys() - before.keys())]
          for row in new_rows:
              print(json.dumps(row, sort_keys=True))
          raise SystemExit(1 if new_rows else 0)
          PY
          control_new_process_exit=$?
          comm -13 \
            "$GITHUB_WORKSPACE/evidence/boundary/control-sockets-before.txt" \
            "$GITHUB_WORKSPACE/evidence/boundary/control-sockets-after.txt" \
            > "$GITHUB_WORKSPACE/evidence/boundary/control-new-sockets.txt"
          control_new_socket_exit=$?
          if [ "$control_new_socket_exit" -eq 0 ] && [ -s "$GITHUB_WORKSPACE/evidence/boundary/control-new-sockets.txt" ]; then
            control_new_socket_exit=1
          fi
          {
            printf 'benchmark=%s\n' "$control_exit"
            printf 'processes_before=%s\n' "$control_processes_before_exit"
            printf 'processes_after=%s\n' "$control_processes_after_exit"
            printf 'new_processes=%s\n' "$control_new_process_exit"
            printf 'sockets_before=%s\n' "$control_sockets_before_exit"
            printf 'sockets_after=%s\n' "$control_sockets_after_exit"
            printf 'new_sockets=%s\n' "$control_new_socket_exit"
            printf 'process_exclusion=inventory_scanner_pid_only\n'
          } > "$GITHUB_WORKSPACE/evidence/boundary/control-child-statuses.txt"
          printf '%s\n' "$control_exit" > "$GITHUB_WORKSPACE/evidence/control-exit.txt"
          exit 0

      - name: Record final control cleanup and original shared-HOME residue
        if: success()
        run: |
          set +e
          set -o pipefail
          boundary_exit=0
          runtime_manifest() {
            for root in \
              "$HOME/.local/state/cmuxlayer" \
              "$HOME/.local/state/cmux-agents" \
              "$HOME/.cmux" \
              "$HOME/.cmuxlayer" \
              "$HOME/.config/cmuxlayer"
            do
              if [ -e "$root" ]; then
                find -P "$root" -xdev -printf '%y %p -> %l\n'
                find -P "$root" -xdev -type f -exec sha256sum {} +
              else
                printf 'ABSENT %s\n' "$root"
              fi
            done | LC_ALL=C sort
          }
          runtime_manifest > evidence/boundary/after-control-runtime.txt
          manifest_exit=$?
          if [ "$manifest_exit" -ne 0 ]; then
            boundary_exit=50
          elif ! cmp evidence/boundary/before-control-runtime.txt evidence/boundary/after-control-runtime.txt; then
            diff -u evidence/boundary/before-control-runtime.txt evidence/boundary/after-control-runtime.txt \
              > evidence/boundary/control-shared-home-residue.diff
          fi
          control_scratch=evidence/control/scratch
          if [ -d "$control_scratch" ] && find "$control_scratch" -mindepth 1 -print -quit | grep -q .; then
            find "$control_scratch" -mindepth 1 -maxdepth 3 -print \
              > evidence/boundary/control-scratch-residue.txt
            boundary_exit=51
          fi
          control_children=evidence/boundary/control-child-statuses.txt
          if [ ! -f "$control_children" ]; then
            boundary_exit=52
          elif grep -Ev '^(benchmark|process_exclusion)=' "$control_children" | grep -Ev '=0$' > evidence/boundary/control-child-failures.txt; then
            boundary_exit=53
          fi
          printf '%s\n' "$boundary_exit" > evidence/boundary/control-boundary-exit.txt
          exit "$boundary_exit"

      - name: Upload paired evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: 636-649-paired-control
          path: evidence/

      - name: Propagate boundary and benchmark exits
        if: always()
        run: |
          set -euo pipefail
          candidate_boundary=$(cat evidence/boundary/candidate-boundary-exit.txt 2>/dev/null || printf '90')
          control_boundary=$(cat evidence/boundary/control-boundary-exit.txt 2>/dev/null || printf '91')
          candidate_exit=$(cat evidence/candidate-exit.txt 2>/dev/null || printf '92')
          control_exit=$(cat evidence/control-exit.txt 2>/dev/null || printf '93')
          printf 'candidate_boundary=%s control_boundary=%s candidate=%s control=%s\n' \
            "$candidate_boundary" "$control_boundary" "$candidate_exit" "$control_exit"
          if [ "$candidate_boundary" -ne 0 ]; then exit "$candidate_boundary"; fi
          if [ "$control_boundary" -ne 0 ]; then exit "$control_boundary"; fi
          if [ "$candidate_exit" -ne 0 ]; then exit "$candidate_exit"; fi
          exit "$control_exit"
