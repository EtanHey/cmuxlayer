name: NIGHTLY capability
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  capability:
    name: NIGHTLY capability (advisory)
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Download and verify pinned NIGHTLY
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '{"status":"FAIL","stage":"capability prerequisites"}' > "$RUNNER_TEMP/capability.json"
          printf '%s\n' '| row | status |' '| --- | --- |' '| capability prerequisites | FAIL |' > "$RUNNER_TEMP/capability.md"
          test "$(uname -m)" = arm64
          http_status=$(curl --location --retry 2 --write-out '%{http_code}' -o "$RUNNER_TEMP/nightly.dmg" \
            'https://github.com/manaflow-ai/cmux/releases/download/nightly/cmux-nightly-macos-arm64-3742448899801.dmg')
          if [ "$http_status" = 404 ]; then
            printf '%s\n' '{"status":"FAIL","stage":"asset_gone"}' > "$RUNNER_TEMP/capability.json"
            printf '%s\n' '| row | status |' '| --- | --- |' '| asset_gone | FAIL |' > "$RUNNER_TEMP/capability.md"
            exit 1
          fi
          test "$http_status" = 200
          echo '93d99db4e384722cde93aeee9121284dcd1766732701084b3a0ddc772b952e1c  '"$RUNNER_TEMP/nightly.dmg" | shasum -a 256 -c -
          hdiutil attach "$RUNNER_TEMP/nightly.dmg" -nobrowse -mountpoint "$RUNNER_TEMP/nightly-mount"
          trap 'hdiutil detach "$RUNNER_TEMP/nightly-mount"' EXIT
          ditto "$RUNNER_TEMP/nightly-mount/cmux NIGHTLY.app" "$RUNNER_TEMP/cmux NIGHTLY.app"
          xcrun stapler validate "$RUNNER_TEMP/cmux NIGHTLY.app"
          spctl -a --type execute "$RUNNER_TEMP/cmux NIGHTLY.app"
      - name: Shell capability (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          launchctl print "gui/$(id -u)" > "$RUNNER_TEMP/gui-session.txt"
          node scripts/ratchet-live.mjs --capability --app "$RUNNER_TEMP/cmux NIGHTLY.app" --output "$RUNNER_TEMP/capability.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: nightly-capability
          path: |
            ${{ runner.temp }}/capability.json
            ${{ runner.temp }}/capability.md
            ${{ runner.temp }}/gui-session.txt
          if-no-files-found: error
