name: CI

on:
  workflow_dispatch:
    inputs:
      baseline_source_run_id:
        description: Optional same-branch perf-budget run to rebase runner measurements
        required: false
        type: string
      baseline_increase_reason:
        description: Required audit reason if imported measurements raise any committed row
        required: false
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  docs-local-guard:
    name: No tracked docs.local
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Guard against tracked docs.local
        run: bash scripts/guard-no-docslocal.sh

  perf-budget:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: perf-budget-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # The benchmark measures a live daemon on a shared runner, so its p95 rows
      # carry real variance. On a pull request that cannot alter runtime
      # behaviour, a red row is noise that costs a re-run and teaches people to
      # ignore the check. Scope it to diffs that could actually move the numbers
      # and warn-and-skip otherwise.
      #
      # This is a step rather than an `on.pull_request.paths` filter because a
      # paths filter is workflow-level: ci.yml carries seven jobs, and gating the
      # file would silently gate test, build-site, launcher-parity and the rest
      # along with this one. GitHub has no per-job paths filter.
      - name: Decide whether the benchmark must run
        id: scope
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            // Anything that can move a daemon timing. Deliberately wider than
            // src/: skipping a baseline or harness edit would let a budget
            // change land unmeasured, which is the one failure this guard must
            // not introduce.
            const PERF_RELEVANT = [
              'src/',
              'benchmarks/',
              'scripts/bench-daemon',
              'scripts/check-daemon-benchmark',
              'package.json',
              'bun.lock',
              'package-lock.json',
              '.github/workflows/ci.yml',
            ];

            if (context.eventName !== 'pull_request') {
              core.setOutput('run', 'true');
              core.setOutput(
                'reason',
                `Event \`${context.eventName}\` always runs the budget, so main keeps a complete green-main history.`,
              );
              return;
            }

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });

            const touched = files
              .map((file) => file.filename)
              .filter((name) => PERF_RELEVANT.some((prefix) => name.startsWith(prefix)));

            if (touched.length > 0) {
              const shown = touched.slice(0, 10);
              const more = touched.length - shown.length;
              core.setOutput('run', 'true');
              core.setOutput(
                'reason',
                `Diff touches ${touched.length} performance-relevant path(s), so the budget is enforced strictly:\n`
                  + shown.map((name) => `- \`${name}\``).join('\n')
                  + (more > 0 ? `\n- ...and ${more} more` : ''),
              );
              return;
            }

            core.warning(
              `Skipping the daemon performance budget: none of the ${files.length} changed file(s) `
                + `can affect daemon runtime (matched none of: ${PERF_RELEVANT.join(', ')}).`,
            );
            core.setOutput('run', 'false');
            core.setOutput(
              'reason',
              `None of the ${files.length} changed file(s) can affect daemon runtime, so the benchmark was not run.\n\n`
                + `The budget stays strict on any diff touching: ${PERF_RELEVANT.map((p) => `\`${p}\``).join(', ')}.`,
            );

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        if: steps.scope.outputs.run == 'true'

      - run: rm -f package-lock.json
        if: steps.scope.outputs.run == 'true'
      - run: bun install
        if: steps.scope.outputs.run == 'true'

      - name: Restore bounded green-main benchmark history
        if: steps.scope.outputs.run == 'true'
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: docs.local/scratch/perf-budget/history.json
          key: daemon-perf-history-main-${{ hashFiles('benchmarks/daemon-baseline.json') }}-${{ github.run_id }}
          restore-keys: daemon-perf-history-main-${{ hashFiles('benchmarks/daemon-baseline.json') }}-

      - name: Run daemon performance budget
        if: steps.scope.outputs.run == 'true'
        run: bun run bench:daemon:check

      # Write the skip into the same report the comment step already publishes,
      # so a skipped run reads as SKIPPED rather than as the step's
      # "did not produce a report" ERROR fallback.
      - name: Report skipped performance budget
        if: steps.scope.outputs.run != 'true'
        env:
          REASON: ${{ steps.scope.outputs.reason }}
        run: |
          set -euo pipefail
          mkdir -p docs.local/scratch/perf-budget
          {
            printf '%s\n' '<!-- cmuxlayer-perf-budget -->'
            printf '%s\n\n' '## Daemon performance budget: SKIPPED'
            printf '%s\n' "$REASON"
          } > docs.local/scratch/perf-budget/comment.md

      - name: Save bounded green-main benchmark history
        if: success() && steps.scope.outputs.run == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: docs.local/scratch/perf-budget/history.json
          key: daemon-perf-history-main-${{ hashFiles('benchmarks/daemon-baseline.json') }}-${{ github.run_id }}

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon-perf-budget
          path: docs.local/scratch/perf-budget/

      - name: Create or update performance comment
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- cmuxlayer-perf-budget -->';
            const reportPath = 'docs.local/scratch/perf-budget/comment.md';
            const body = fs.existsSync(reportPath)
              ? fs.readFileSync(reportPath, 'utf8')
              : `${marker}\n## Daemon performance budget: ERROR\n\nThe benchmark did not produce a report. See the job log.`;
            const pull = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });
            if (pull.data.head.sha !== context.payload.pull_request.head.sha) {
              core.notice(`Skipping stale performance comment for ${context.payload.pull_request.head.sha}; current head is ${pull.data.head.sha}`);
              return;
            }
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CMUXLAYER_RUN_TOOL_COUNT_DRIFT: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # package-lock.json is macOS-resolved; remove so bun resolves platform-correct optional deps (e.g. rollup linux binary)
      - run: rm -f package-lock.json
      - run: bun install
      - run: bun run typecheck
      - run: bun run test
      - name: Check bounded event-log RSS
        run: bun run check:event-log-rss

  # Issue #392: spawn/resume must behave equivalently with AND without a
  # repoGolem launcher registry. Runners have none by default, so the "absent"
  # leg is a genuine fresh-install environment rather than a stubbed one.
  launcher-parity:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        launcher_registry: [absent, present]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: rm -f package-lock.json
      - run: bun install

      - name: Plant a repoGolem launcher registry
        if: matrix.launcher_registry == 'present'
        run: |
          mkdir -p "$HOME/.config/ralphtools"
          printf 'repoGolem parityrepo "%s"\n' "$HOME/checkouts/parityrepo" \
            > "$HOME/.config/ralphtools/launchers.zsh"
          mkdir -p "$HOME/checkouts/parityrepo"

      - name: Confirm no registry exists
        if: matrix.launcher_registry == 'absent'
        run: |
          rm -f "$HOME/.config/ralphtools/launchers.zsh"
          test ! -f "$HOME/.config/ralphtools/launchers.zsh"

      - run: bun run test:parity

  launchd-units:
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - run: bash launchd/cmux-caffeinate/tests/run-tests.sh
      - run: bash launchd/cmux-contract-nightly/tests/run-tests.sh
      - run: bash launchd/cmux-memory-watchdog/tests/run-tests.sh
      - run: bash launchd/cmux-ram-sampler/tests/run-tests.sh
      - run: bash scripts/tests/mcp-reaper-launchd.sh

  build-site:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm run build

      # Pages currently deploys landing/, not the Next build above. Package the
      # exact deploy input here so required CI validates artifact creation too.
      - name: Package exact GitHub Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: landing
      - name: Check the static Pages deploy artifact
        working-directory: .
        run: test -s landing/index.html

  perf-baseline-refresh:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      CMUXLAYER_BENCH_RUNNER_CLASS: github-actions-ubuntu-latest
      GH_TOKEN: ${{ github.token }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - run: rm -f package-lock.json
      - run: bun install

      - name: Import verified runner evidence
        if: inputs.baseline_source_run_id != ''
        env:
          SOURCE_RUN_ID: ${{ inputs.baseline_source_run_id }}
        run: |
          source_run="$(gh run view "$SOURCE_RUN_ID" --json event,headSha,name)"
          source_sha="$(jq -r .headSha <<<"$source_run")"
          test "$(jq -r .event <<<"$source_run")" = pull_request
          test "$(jq -r .name <<<"$source_run")" = CI
          git merge-base --is-ancestor "$source_sha" HEAD
          unexpected_changes="$(git diff --name-only "$source_sha" HEAD | rg -v '^(\.github/workflows/ci\.yml|benchmarks/daemon-baseline\.json|docs/performance-budgets\.md|scripts/(check-daemon-benchmark|refresh-daemon-baseline)\.mjs|tests/perf-budget\.test\.ts)$' || true)"
          test -z "$unexpected_changes"
          mkdir -p docs.local/scratch/imported-perf-budget
          gh run download "$SOURCE_RUN_ID" -n daemon-perf-budget -D docs.local/scratch/imported-perf-budget
          result_path="$(find docs.local/scratch/imported-perf-budget -name result.json -print -quit)"
          test -n "$result_path"
          echo "CMUXLAYER_BENCH_IMPORT_RESULT_PATH=$result_path" >> "$GITHUB_ENV"
          echo "CMUXLAYER_BENCH_SOURCE_RUN_ID=$SOURCE_RUN_ID" >> "$GITHUB_ENV"
          echo "CMUXLAYER_BENCH_SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
      - name: Produce canonical CI-runner baseline
        env:
          BASELINE_INCREASE_REASON: ${{ inputs.baseline_increase_reason }}
        run: |
          if [ -n "$BASELINE_INCREASE_REASON" ]; then
            bun run bench:daemon:refresh -- --reason "$BASELINE_INCREASE_REASON"
          else
            bun run bench:daemon:refresh
          fi

      - name: Upload candidate baseline
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daemon-perf-baseline-${{ github.run_id }}
          path: |
            benchmarks/daemon-baseline.json
            docs.local/scratch/perf-budget/result.json
            docs.local/scratch/perf-budget/refresh-samples.json
